name: Dependabot auto-merge

on:
  pull_request_target:
    branches:
      - main
    paths:
      - .github/workflows/**
      - apps/*/package.json
      - package.json
      - packages/*/package.json
      - pnpm-lock.yaml
    types:
      - labeled

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.label.name == 'dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Detect Pages-impacting changes
        id: pages
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        shell: bash
        run: |
          required=false

          while IFS= read -r path; do
            case "$path" in
              apps/web/package.json|packages/*/package.json)
                ;;
              .github/workflows/deploy-pages.yml|apps/web/*|package.json|packages/*|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json)
                required=true
                break
                ;;
            esac
          done < <(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')

          echo "required=$required" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Wait for CI to succeed
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        shell: bash
        run: |
          for attempt in {1..30}; do
            run_id="$(gh run list \
              --workflow CI \
              --event pull_request \
              --branch "$HEAD_REF" \
              --commit "$HEAD_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"

            if [[ -n "$run_id" ]]; then
              gh run watch "$run_id" --exit-status
              exit 0
            fi

            sleep 10
          done

          echo "::error::CI run was not found for $HEAD_SHA"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Merge minor and patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --merge "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Deploy updated web app
        if: steps.pages.outputs.required == 'true'
        run: gh workflow run deploy-pages.yml --ref "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
