<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="128 128 768 768" fill="none">
  <title>Docfilly icon</title>
  <desc>A rounded navy tile containing a document outline, lime variable brackets, and a violet value block.</desc>

  <defs>
    <linearGradient id="tile" x1="240" y1="190" x2="790" y2="835" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13253D"/>
      <stop offset="1" stop-color="#0B1B31"/>
    </linearGradient>
    <linearGradient id="lime" x1="360" y1="405" x2="565" y2="605" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8FF55"/>
      <stop offset="1" stop-color="#B7EF43"/>
    </linearGradient>
    <linearGradient id="violet" x1="435" y1="454" x2="505" y2="526" gradientUnits="userSpaceOnUse">
      <stop stop-color="#665BFF"/>
      <stop offset="1" stop-color="#5145E8"/>
    </linearGradient>
    <filter id="softShadow" x="134" y="134" width="756" height="770" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#071321" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="154" y="154" width="716" height="716" rx="124" fill="url(#tile)"/>
  </g>

  <g transform="translate(35 0)">
    <path
      d="M350 271H542L676 405V681C676 720.8 643.8 753 604 753H350C310.2 753 278 720.8 278 681V343C278 303.2 310.2 271 350 271Z"
      stroke="white"
      stroke-width="34"
      stroke-linejoin="round"/>

    <path
      d="M542 275V373C542 390.7 556.3 405 574 405H671"
      stroke="white"
      stroke-width="34"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <path
      d="M407 451H366V633H407"
      stroke="url(#lime)"
      stroke-width="28"
      stroke-linejoin="miter"/>

    <path
      d="M547 451H588V633H547"
      stroke="url(#lime)"
      stroke-width="28"
      stroke-linejoin="miter"/>

    <rect x="439" y="500" width="76" height="76" rx="2" fill="url(#violet)"/>
  </g>
</svg>
