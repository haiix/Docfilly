name: Deploy web app to GitHub Pages

on:
  workflow_call:
    inputs:
      verified-sha:
        description: Main commit that passed the calling CI workflow
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Publish both directories together, serializing source selection and deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build stable and development apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select released and verified sources
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ inputs.verified-sha }}
        shell: bash
        run: |
          set -euo pipefail
          stable=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          dev=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // empty')
          if [ -n "$VERIFIED_SHA" ]; then
            if [ -z "$dev" ] || git merge-base --is-ancestor "$dev" "$VERIFIED_SHA"; then
              dev="$VERIFIED_SHA"
            fi
          fi
          if [ -z "$dev" ]; then
            echo "No verified main commit is available for deployment." >&2
            exit 1
          fi
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"

      - name: Checkout verified development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.sources.outputs.dev }}
          path: dev-source

      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.sources.outputs.stable }}
          path: stable-source

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Build development app
        working-directory: dev-source
        env:
          DOCFILLY_CHANNEL: main
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @docfilly/web build

      - name: Build released app
        env:
          DOCFILLY_CHANNEL: release
        run: |
          # Adapt deployment configuration for releases predating channel-aware paths.
          # Application sources and the lockfile remain those of the release tag.
          if [ ! -f stable-source/apps/web/src/build-info.ts ]; then
            cp apps/web/vite.config.ts stable-source/apps/web/vite.config.ts
          fi
          cd stable-source
          pnpm install --frozen-lockfile
          pnpm --filter @docfilly/web build

      - name: Assemble both apps and root migration files
        run: node scripts/assemble-pages.mjs dev-source/apps/web/dist stable-source/apps/web/dist pages-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages-dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
