version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    labels:
      - dependencies

    ignore:
      # Re-enable TypeScript 7 updates once typescript-eslint and other tooling
      # officially support it. See PR #24.
      - dependency-name: typescript
        versions:
          - ">=7.0.0 <8.0.0"

    groups:
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    labels:
      - dependencies
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
